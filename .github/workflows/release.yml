name: Release

# Pushing a tag such as v0.2.0 builds that commit and attaches the runnable jar, the OpenAPI spec and the report PDF
# to its GitHub release. A release written by hand beforehand keeps its notes; otherwise the notes list the merged PRs
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The tag must match the version in pom.xml, so the jar's name and the release agree
      - name: Check the version
        run: |
          version=$(./mvnw -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in pom.xml"
            exit 1
          fi

      # Every kind of test runs again, so a release is never cut from a commit that fails them
      - run: ./mvnw -B verify

      - uses: ./.github/actions/setup-report

      # The report as it stands at this tag, named after the version so downloads from different releases don't clash
      - name: Build the report
        working-directory: .
        run: |
          report/pdf/build.sh
          cp report/pdf/out/report.pdf "report-$GITHUB_REF_NAME.pdf"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" "target/gym-membership-${GITHUB_REF_NAME#v}.jar" postman/specs/openapi.yaml \
            "../report-$GITHUB_REF_NAME.pdf" --clobber
