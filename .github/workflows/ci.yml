name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Compiles, runs every test including the ArchUnit rules, and packages the jar.
      # A failing test fails the job, which blocks the merge.
      - run: ./mvnw -B verify
      - uses: actions/upload-artifact@v7
        with:
          name: gym-membership
          path: code/target/gym-membership-*.jar
