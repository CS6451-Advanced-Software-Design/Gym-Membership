name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the run it replaces
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CK_VERSION: 0.7.0
  JACOCO_VERSION: 0.8.15
  # §9's refactoring must not be allowed to regress. Coverage is checked against the merged report (all three
  # test lanes), not any single lane, since no lane alone reaches this on its own
  COVERAGE_MIN: 90

jobs:
  tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: unit
            name: Unit tests
            skip: -Dskip.integration -Dskip.e2e
          - kind: integration
            name: Integration tests
            skip: -Dskip.unit -Dskip.e2e -Dpmd.skip
          - kind: e2e
            name: End-to-end tests
            skip: -Dskip.unit -Dskip.integration -Dpmd.skip
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Compiles, packages the jar and runs one kind of test (unit *Test, integration *IT or end-to-end *E2E),
      # recording its coverage. A failing test fails the job. The unit lane also runs PMD
      - run: ./mvnw -B verify ${{ matrix.skip }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.kind }}
          path: code/target/jacoco.exec

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.kind == 'unit'
        with:
          name: gym-membership
          path: code/target/gym-membership-*.jar

      # The compiled classes the coverage was recorded against, and the PMD report, for the metrics job
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.kind == 'unit'
        with:
          name: analysis
          path: |
            code/target/classes/
            code/target/pmd.xml
            code/target/reports/pmd.html

  metrics:
    name: Metrics
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: analysis
          path: code/target
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: code/target/coverage

      # Each lane recorded its own coverage. Merge them so the report covers every kind of test
      - name: Coverage
        run: |
          curl -sLfo "$RUNNER_TEMP/jacococli.jar" "https://repo1.maven.org/maven2/org/jacoco/org.jacoco.cli/$JACOCO_VERSION/org.jacoco.cli-$JACOCO_VERSION-nodeps.jar"
          java -jar "$RUNNER_TEMP/jacococli.jar" merge target/coverage/*/jacoco.exec --destfile target/jacoco.exec
          mkdir -p target/site/jacoco
          java -jar "$RUNNER_TEMP/jacococli.jar" report target/jacoco.exec --classfiles target/classes --sourcefiles src/main/java \
            --html target/site/jacoco --csv target/site/jacoco/jacoco.csv --xml target/site/jacoco/jacoco.xml
          for kind in unit integration e2e; do
            java -jar "$RUNNER_TEMP/jacococli.jar" report "target/coverage/coverage-$kind/jacoco.exec" --classfiles target/classes --csv "target/coverage/$kind.csv"
          done

      # CK class metrics (CBO, WMC, RFC, LCOM, LOC) for the §9 refactoring table.
      # CK logs through log4j 1.x, which warns when it has no config, so give it one that only prints warnings and errors
      - name: CK
        run: |
          curl -sLfo "$RUNNER_TEMP/ck.jar" "https://repo1.maven.org/maven2/com/github/mauricioaniche/ck/$CK_VERSION/ck-$CK_VERSION-jar-with-dependencies.jar"
          printf '%s\n' 'log4j.rootLogger=WARN, console' 'log4j.appender.console=org.apache.log4j.ConsoleAppender' 'log4j.appender.console.layout=org.apache.log4j.SimpleLayout' > "$RUNNER_TEMP/log4j.properties"
          mkdir -p target/ck
          java -Dlog4j.configuration="file:$RUNNER_TEMP/log4j.properties" -jar "$RUNNER_TEMP/ck.jar" src/main/java false 0 false target/ck/

      - name: Summary
        run: |
          {
            echo "## Metrics"
            echo
            echo "### Coverage (JaCoCo)"
            lines() { awk -F, 'NR > 1 { missed += $8; covered += $9 } END { printf "%.1f%% (%d of %d lines)", 100 * covered / (missed + covered), covered, missed + covered }' "$1"; }
            echo "| Tests | Line coverage |"
            echo "| --- | --- |"
            echo "| Unit | $(lines target/coverage/unit.csv) |"
            echo "| Integration | $(lines target/coverage/integration.csv) |"
            echo "| End-to-end | $(lines target/coverage/e2e.csv) |"
            echo "| **All** | **$(lines target/site/jacoco/jacoco.csv)** |"
            echo
            echo "The share of lines in \`src/main\` that at least one test ran. A line no test runs could break without any test noticing."
            echo
            echo "### PMD"
            echo "Violations: **$(grep -c '<violation' target/pmd.xml || true)**"
            echo
            echo "Places where the code breaks a design or best-practice rule in \`code/pmd-ruleset.xml\`, e.g. a class doing too much (\`GodClass\`) or a caught exception losing its cause."
            echo
            echo "### CK: the 5 most coupled classes"
            echo "| Class | CBO | WMC | RFC | LOC |"
            echo "| --- | --- | --- | --- | --- |"
            awk -F, 'NR == 1 { for (i = 1; i <= NF; i++) column[$i] = i; next }
                     { print $column["cbo"] "|" $column["class"] "|" $column["wmc"] "|" $column["rfc"] "|" $column["loc"] }' target/ck/class.csv \
              | sort -t'|' -k1,1nr | head -5 \
              | awk -F'|' '{ print "| `" $2 "` | " $1 " | " $3 " | " $4 " | " $5 " |" }'
            echo
            echo "| Metric | Measures | Higher means |"
            echo "| --- | --- | --- |"
            echo "| **CBO**: Coupling Between Objects | How many other classes it uses or is used by | A change elsewhere is more likely to break it |"
            echo "| **WMC**: Weighted Methods per Class | The total cyclomatic complexity of its methods | More branches, so harder to understand and test |"
            echo "| **RFC**: Response For a Class | Its methods plus the methods they call | A call into it can set off more behaviour |"
            echo "| **LOC**: Lines Of Code | Its size, without blank lines and comments | More to read and maintain |"
          } > "$RUNNER_TEMP/metrics.md"
          cat "$RUNNER_TEMP/metrics.md" >> "$GITHUB_STEP_SUMMARY"

      # One comment per pull request, edited in place on every push so the numbers stay current
      - name: Comment on the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --edit-last --create-if-none --body-file "$RUNNER_TEMP/metrics.md"

      # After the comment, so a failing run still shows the team the numbers that failed it
      - name: Coverage gate
        run: |
          awk -F, -v min="$COVERAGE_MIN" 'NR > 1 { missed += $8; covered += $9 }
            END {
              pct = 100 * covered / (missed + covered)
              printf "Line coverage: %.1f%% (minimum: %s%%)\n", pct, min
              if (pct < min) {
                print "::error::Line coverage " pct "% is below the required " min "%"
                exit 1
              }
            }' target/site/jacoco/jacoco.csv

      # Kept for every run, so the "before" numbers for §9 exist without anyone remembering to save them
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: metrics
          path: |
            code/target/jacoco.exec
            code/target/site/jacoco/
            code/target/pmd.xml
            code/target/reports/pmd.html
            code/target/ck/
