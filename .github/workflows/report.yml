name: Report

# Builds the report PDF from report/sections on every change to the report, so each PR shows the real page count.
# Fails if a section goes over the spec's page limit
on:
  pull_request:
    paths: ['report/**', '.github/workflows/report.yml']
  push:
    branches: [main]
    paths: ['report/**', '.github/workflows/report.yml']

concurrency:
  group: report-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PANDOC_VERSION: 3.12.1
  TYPST_VERSION: 0.15.1

jobs:
  report:
    name: Report PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pandoc and Typst
        run: |
          curl -sSfL -o pandoc.deb "https://github.com/jgm/pandoc/releases/download/$PANDOC_VERSION/pandoc-$PANDOC_VERSION-1-amd64.deb"
          sudo dpkg -i pandoc.deb
          curl -sSfL "https://github.com/typst/typst/releases/download/v$TYPST_VERSION/typst-x86_64-unknown-linux-musl.tar.xz" | tar -xJ
          sudo mv typst-x86_64-unknown-linux-musl/typst /usr/local/bin/

      - name: Build
        run: |
          set -o pipefail
          report/pdf/build.sh | tee summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: report
          path: report/pdf/out/report.pdf
