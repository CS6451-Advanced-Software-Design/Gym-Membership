spring.application.name=gym-membership

# Railway and similar hosts tell the app which port to listen on through PORT
server.port=${PORT:8080}

# Railway ends HTTPS at its proxy, so redirects follow its X-Forwarded headers to stay on https
server.forward-headers-strategy=framework

# Folder for the JSON files behind the repository adapters, relative to where the app starts
gym.persistence.directory=data

# Member ids whose card the fake payment gateway always declines, to demo failed payments (BR-M4)
gym.payment.declined-members=

# OpenAPI spec: every endpoint returns JSON, and lists only the error responses it declares itself
springdoc.default-produces-media-type=application/json
springdoc.override-with-generic-response=false

# Opening the app's address shows the Swagger UI
springdoc.swagger-ui.use-root-path=true
