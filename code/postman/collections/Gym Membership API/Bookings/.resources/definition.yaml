description: "Runs the class timetable: the schedule, bookings, the waitlist and attendance. <ul> <li><b>Booking:</b> a member holds at most 5 future bookings. Off-Peak members can book off-peak classes only, and a premium class costs €8 unless the member is on an Annual plan.</li> <li><b>Waitlist:</b> a full class has a first-come, first-served waitlist. When a place comes free, the first member who can still book gets it automatically and is notified.</li> <li><b>Cancelling:</b> less than 2 hours before the class costs €5. Trial members pay nothing, but a late cancellation still counts against their 2 bookings.</li> <li><b>No-shows:</b> each costs €5, and 3 in 30 days suspend booking for 7 days.</li> <li><b>Undo:</b> a member can take back their bookings and cancellations, newest first. Fees are not refunded.</li> </ul> <p>A request the rules don't allow is refused with a 422 problem."
