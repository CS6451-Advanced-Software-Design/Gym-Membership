$kind: http-example
request:
  url: "{{baseUrl}}/classes"
  method: POST
  headers:
    Accept: application/problem+json
  body:
    type: json
    content: |-
      {
        "capacity": 12,
        "name": "Spin",
        "startTime": "1958-05-13T07:01:53.872Z",
        "premium": false
      }
response:
  statusCode: 422
  statusText: Unprocessable Entity (WebDAV) (RFC 4918)
  headers:
    Content-Type: application/problem+json
  body:
    type: json
    content: |-
      {
        "detail": "A class needs at least 1 place, not 0",
        "instance": "/classes",
        "status": 422,
        "title": "Unprocessable Content"
      }
order: 3000
