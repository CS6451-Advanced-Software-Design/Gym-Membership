$kind: http-example
request:
  url: "{{baseUrl}}/bookings/:bookingId/attended"
  method: POST
  headers:
    Accept: application/problem+json
  pathVariables:
    - key: bookingId
      value: b-b94b7221
      disabled: false
      description: (Required) the booking to mark
  body:
    type: text
    content: ""
response:
  statusCode: 422
  statusText: Unprocessable Entity (WebDAV) (RFC 4918)
  headers:
    Content-Type: application/problem+json
  body:
    type: json
    content: |-
      {
        "detail": "Booking b-b94b7221 is ATTENDED, so it can't be marked as attended",
        "instance": "/bookings/b-b94b7221/attended",
        "status": 422,
        "title": "Unprocessable Content"
      }
order: 3000
