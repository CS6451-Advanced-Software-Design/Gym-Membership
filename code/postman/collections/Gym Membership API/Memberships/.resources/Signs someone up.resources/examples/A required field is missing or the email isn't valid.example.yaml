$kind: http-example
request:
  url: "{{baseUrl}}/memberships"
  method: POST
  headers:
    Accept: application/problem+json
  body:
    type: json
    content: |-
      {
        "name": "Ann Byrne",
        "email": "ann.byrne@gmail.com",
        "plan": "MONTHLY"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/problem+json
  body:
    type: json
    content: |-
      {
        "title": "Bad Request",
        "status": 400,
        "detail": "Invalid request content.",
        "instance": "/memberships"
      }
order: 2000
