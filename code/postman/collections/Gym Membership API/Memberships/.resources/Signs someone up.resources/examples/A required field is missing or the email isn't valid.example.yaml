$kind: http-example
request:
  url: "{{baseUrl}}/memberships"
  method: POST
  headers:
    Accept: application/problem+json
  body:
    type: json
    content: |-
      {
        "email": "ann@example.com",
        "name": "Ann Byrne",
        "plan": "MONTHLY",
        "studentId": "24123456",
        "employer": "Stripe",
        "familyId": "byrne",
        "referralCode": "ms-3f9c2a1b"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/problem+json
  body:
    type: json
    content: |-
      {
        "title": "Bad Request",
        "status": 400,
        "detail": "Invalid request content.",
        "instance": "/memberships"
      }
order: 2000
