$kind: http-example
name: The email already has a membership, the student ID is missing or not 8 digits, or the referral code is unknown
request:
  url: "{{baseUrl}}/memberships"
  method: POST
  headers:
    Accept: application/problem+json
  body:
    type: json
    content: |-
      {
        "name": "Ann Byrne",
        "email": "ann.byrne@gmail.com",
        "plan": "MONTHLY"
      }
response:
  statusCode: 422
  statusText: Unprocessable Entity (WebDAV) (RFC 4918)
  headers:
    Content-Type: application/problem+json
  body:
    type: json
    content: |-
      {
        "title": "Unprocessable Content",
        "status": 422,
        "detail": "The Student plan needs an 8-digit student ID",
        "instance": "/memberships"
      }
order: 3000
