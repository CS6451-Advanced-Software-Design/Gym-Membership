$kind: http-example
request:
  url: "{{baseUrl}}/memberships/:membershipId/unfreeze"
  method: POST
  headers:
    Accept: application/problem+json
  pathVariables:
    - key: membershipId
      value: ms-3f9c2a71
      disabled: false
      description: (Required) the membership to unfreeze
  body:
    type: text
    content: ""
response:
  statusCode: 422
  statusText: Unprocessable Entity (WebDAV) (RFC 4918)
  headers:
    Content-Type: application/problem+json
  body:
    type: json
    content: |-
      {
        "title": "Unprocessable Content",
        "status": 422,
        "detail": "Membership ms-3f9c2a71 is Active, so it can't be unfrozen",
        "instance": "/memberships/ms-3f9c2a71/unfreeze"
      }
order: 3000
