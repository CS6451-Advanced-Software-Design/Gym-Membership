$kind: http-example
request:
  url: "{{baseUrl}}/memberships/:membershipId"
  method: GET
  headers:
    Accept: application/json
  pathVariables:
    - key: membershipId
      value: ms-ann
      disabled: false
      description: (Required) the membership to show
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "membershipId": "ms-ann",
        "memberId": "m-ann",
        "plan": "MONTHLY",
        "status": "ACTIVE",
        "startDate": "2026-10-18T00:00:00.000Z",
        "endDate": null,
        "trialEndsOn": null,
        "trialBookingsLeft": null,
        "frozenUntil": null,
        "lapsedSince": null,
        "failedPayments": 0
      }
order: 1000
