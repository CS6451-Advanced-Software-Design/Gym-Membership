$kind: http-request
description: Freezes a membership. <p>Only an <code>ACTIVE</code> membership can be frozen, for 1 to 3 months and at most once in 12 months. It isn't billed while frozen, and the daily checks unfreeze it when the months are up.
url: "{{baseUrl}}/memberships/:membershipId/freeze"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: membershipId
    value: ms-3f9c2a71
    disabled: false
    description: (Required) the membership to freeze
body:
  type: json
  content: |-
    {
      "months": 2
    }
settings: {}
examples: ./.resources/Freezes a membership.resources/examples
order: 4000
