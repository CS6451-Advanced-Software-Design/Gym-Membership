description: "Shows a member's profile and checks them in for a visit. <p>A check-in is only recorded if the member's current membership lets them in right now: <ul> <li><b>State:</b> a <code>TRIAL</code> or <code>ACTIVE</code> membership can check in; a <code>FROZEN</code>, <code>LAPSED</code> or <code>CANCELLED</code> one can't.</li> <li><b>Plan:</b> an Off-Peak plan only lets the member in on weekdays, from 10:00 to 16:00.</li> </ul>"
