$kind: collection
description: "Charges members for their memberships and shows them what they paid. <p>Each month a membership's invoice is the <b>plan fee</b>, minus the <b>best discount</b>, plus <b>penalties</b>, minus <b>referral credits</b>: <ul> <li><b>Plan fee:</b> Monthly €45, Student €30, Off-Peak €30. Annual is €450 for the year, paid upfront at sign-up. A member who joins mid-month pays only for the days left in that month.</li> <li><b>Best discount:</b> discounts don't stack, only the largest applies. Corporate 15%, Family 10% (someone in the family joined earlier), Loyalty 5% (a member for more than 24 months).</li> <li><b>Penalties:</b> €5 for a late cancellation or a no-show, €8 for a premium class.</li> <li><b>Referral credits:</b> €20 per friend referred, up to €60 a year. A credit that doesn't fit within the bill waits for the next one.</li> </ul> <p>The member's card is charged as soon as the invoice is issued. A declined card leaves the invoice <code>UNPAID</code> until the member pays their arrears."
order: 1000
